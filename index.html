<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nachttocht</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin:0;
}

h1{
    margin-top:20px;
}

input, button{
    width:80%;
    max-width:320px;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

input{
    background:#222;
    color:white;
}

button{
    background:#444;
    color:white;
    cursor:pointer;
}

button:disabled{
    opacity:0.5;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    font-size:20px;
}

.red{
    background:darkred;
}

.green{
    background:darkgreen;
}

a{
    color:white;
    font-weight:bold;
    text-decoration:none;
    display:block;
    margin-top:15px;
    font-size:22px;
}
</style>
</head>

<body>

<h1>🌙 Nachttocht</h1>

<div id="start">
    <input id="team" placeholder="Teamnaam">
    <br>
    <button onclick="startGame()">Start</button>
</div>

<div id="game" style="display:none;">
    <h2 id="question"></h2>

    <input id="answer" placeholder="Antwoord">
    <br>

    <button id="btn" onclick="check()">Check</button>

    <div id="result"></div>
</div>

<script>

let testMode = true; // TRUE = thuis testen / FALSE = echte tocht

let step = 0;
let locked = false;
let waitingForArrival = false;
let teamName = "";

const savedStep = localStorage.getItem("step");

if(savedStep){
    step = parseInt(savedStep);
}

const roasts = [
"Dit is niet eens fout… dit is zorgwekkend",
"Hebben jullie dit serieus samen bedacht?",
"Zelfs een boom had dit beter gedaan 🌳",
"Ik zou opnieuw beginnen met denken",
"Zijn jullie moe of gewoon slecht?",
"Dit antwoord deed pijn"
];

const wrongLocation = [
"Jullie zitten zo verkeerd dat Google Maps jullie heeft opgegeven",
"Dit is niet eens in de buurt. Probeer opnieuw",
"Loop. Gewoon… loop ergens anders heen",
"Serieus? Kijk eens om je heen",
"Dit is letterlijk de verkeerde plek"
];

const good = [
"Oké dit was verrassend competent",
"Niet slecht… voor amateurs",
"We vermoeden valsspelen",
"Eindelijk. We waren al bang",
"Prima. Doorlopen."
];

const steps = [
{
q: "Hier ligt Jos, de buurman van Wout. Wat is de voornaam van de persoon waar Jos zijn plicht aan vervulde?",
a: "wilhelmina",
lat: 50.7549,
lon: 5.9786,
next: "https://maps.app.goo.gl/KUdXTVx9LmofmZ9V7"
},
{
q: "Joey ligt graag aan een nudistenstrand in zijn vrije tijd. Daarover gesproken; hoe lang geleden was hier nog zee? (getal zonder punten)",
a: "12000000",
lat: 50.7725,
lon: 5.9517,
next: "https://maps.app.goo.gl/6rsYdBFLkuKFyJ4n9"
},
{
q: "Welkom bij het Emmaus, een oud ontspanningsgebouw voor priesterstudenten. Over ontspanning gesproken; wat eet de rowanleiding het liefste?",
a: "frikandellenkapsalon",
lat: 50.7779,
lon: 5.9485,
next: "https://maps.app.goo.gl/ka1CvVrWQDvBPkxQA"
}
];

function startGame(){

    teamName = document.getElementById("team").value || "Onbekend team";

    document.getElementById("start").style.display = "none";
    document.getElementById("game").style.display = "block";

    load();
}

function load(){

    document.getElementById("answer").value = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("btn").disabled = false;

    if(waitingForArrival){

        document.getElementById("question").innerHTML =
        "🚶 Onderweg naar de volgende locatie...";

    } else {

        document.getElementById("question").innerText =
        steps[step].q;
    }
}

function random(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function distance(a,b,c,d){
    return Math.sqrt((a-c)**2 + (b-d)**2);
}

document.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        check();
    }
});

function check(){

    if(locked) return;

    document.getElementById("btn").disabled = true;

    show("📍 Locatie controleren...", "green");

    navigator.geolocation.getCurrentPosition(pos => {

        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        if(!testMode){

            let dist = distance(lat,lon,steps[step].lat,steps[step].lon);

            if(dist > 0.0007){

                show(random(wrongLocation), "red");

                document.getElementById("btn").disabled = false;

                return;
            }

            // aangekomen op nieuwe locatie
            if(waitingForArrival){

                waitingForArrival = false;

                load();

                return;
            }
        }

        let ans = document.getElementById("answer")
        .value
        .toLowerCase()
        .replace(/\s/g,'');

        if(ans === steps[step].a){

            let nextLink = steps[step].next;

            step++;

            localStorage.setItem("step", step);

            if(step >= steps.length){

                localStorage.clear();

                document.body.innerHTML = `
                <h1>🏁 Welkom op het kampterrein</h1>
                <p>Team ${teamName}, jullie hebben het overleefd… soort van 😈</p>
                `;

                return;
            }

            waitingForArrival = true;

            show(
                random(good) +
                `<br><br>
                <a href="${nextLink}" target="_blank">
                ➡️ Open volgende locatie
                </a>`,
                "green"
            );

            setTimeout(load, 2500);

        } else {

            locked = true;

            let timeLeft = 90;

            const timer = setInterval(() => {

                show(
                    random(roasts) +
                    `<br><br>${timeLeft}s wachten...`,
                    "red"
                );

                timeLeft--;

                if(timeLeft < 0){

                    clearInterval(timer);

                    locked = false;

                    document.getElementById("btn").disabled = false;

                    document.getElementById("result").innerHTML = "";
                }

            },1000);
        }

    }, () => {

        show("GPS werkt niet 😬", "red");

        document.getElementById("btn").disabled = false;

    });
}

function show(text,color){

    let r = document.getElementById("result");

    r.innerHTML = text;

    r.className = color;
}

</script>

</body>
</html>
